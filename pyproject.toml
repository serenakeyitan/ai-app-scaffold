[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-app-scaffold"
version = "0.1.0"
description = "Zero-to-prod AI app scaffold CLI — wire up auth, payments, database, monitoring & more in one command"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "serenakeyitan"},
]
keywords = ["ai", "scaffold", "cli", "devops", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "questionary>=2.0.0",
    "toml>=0.10.0",
    "requests>=2.31.0",
]

[project.scripts]
ai-scaffold = "ai_scaffold.cli:main"

[project.urls]
Homepage = "https://github.com/serenakeyitan/ai-app-scaffold"
Repository = "https://github.com/serenakeyitan/ai-app-scaffold"
Issues = "https://github.com/serenakeyitan/ai-app-scaffold/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scaffold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"
